name: Meno skannaus

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Asenna Chromium
        run: python -m playwright install --with-deps chromium

      - name: Skannaa lähteet ja tunnista tapahtumaehdokkaat
        run: python scraper.py

      - name: Tallenna skannauksen tulokset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: porvoo-scan-results
          path: |
            scan_results.csv
            event_candidates.csv
            facebook_failures.csv
          if-no-files-found: warn
          retention-days: 14
